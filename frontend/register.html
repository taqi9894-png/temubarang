<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - TemuBarang</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-mode="register">
    <header>
      <div class="container navbar">
        <span class="brand">TemuBarang</span>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="items.html">Daftar Barang</a>
          <a href="report.html">Lapor Barang</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="admin.html" data-admin-link hidden>Admin</a>
          <button class="button secondary theme-toggle" type="button" data-theme-toggle aria-pressed="false">Mode gelap</button>
          <span id="user-badge"></span>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="form-wrap">
        <h2 class="section-title">Daftar Akun</h2>
        <p class="muted">Akun yang dibuat lewat pendaftaran mendapat peran <strong>Pengguna</strong>. Akses <strong>Admin</strong> hanya diberikan pada akun yang berwenang.</p>
        <div id="message-box" class="message"></div>
        <form id="auth-form">
          <label>
            Nama lengkap
            <input type="text" name="name" placeholder="Nama Anda" required />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="contoh@email.com" required />
          </label>
          <label>
            Nomor HP (opsional)
            <input type="tel" name="phone" autocomplete="tel" placeholder="081234567890" />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="Minimal 6 karakter" required />
          </label>
          <button type="submit" class="button primary">Daftar</button>
        </form>
        <p class="muted">Sudah punya akun? <a href="login.html">Masuk</a></p>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      renderUserBadge();
    </script>
  </body>
</html>
