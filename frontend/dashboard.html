<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - TemuBarang</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a href="index.html" class="brand">TemuBarang</a>
        <nav class="nav-links">
          <a href="items.html">Daftar Barang</a>
          <a href="report.html">Lapor Barang</a>
          <a href="dashboard.html">Dashboard</a>
          <span id="user-badge"></span>
        </nav>
      </div>
    </header>

    <main class="container section">
      <h2 class="section-title">Dashboard Saya</h2>
      <div id="dashboard-content" class="card"></div>
    </main>

    <script src="js/api.js"></script>
    <script>
      renderUserBadge();

      async function loadDashboard() {
        if (!isLoggedIn()) {
          window.location.href = 'login.html';
          return;
        }

        const content = document.getElementById('dashboard-content');
        try {
          const claims = await apiFetch('http://localhost:3003/api/claims/my', {
            method: 'GET',
            headers: { Authorization: `Bearer ${getCurrentToken()}` },
          });

          const notifications = await apiFetch('http://localhost:3004/api/notifications', {
            method: 'GET',
            headers: { Authorization: `Bearer ${getCurrentToken()}` },
          });

          const claimHtml = (claims.claims || []).length
            ? `<ul class="list">${(claims.claims || []).map((claim) => `
                <li><strong>${claim.item_title}</strong><br><span class="muted">Status: ${claim.status}</span><br><small>${claim.verification_answer}</small></li>
              `).join('')}</ul>`
            : '<div class="empty-state">Belum ada klaim.</div>';

          const notifHtml = (notifications.notifications || []).length
            ? `<ul class="list">${(notifications.notifications || []).map((n) => `
                <li>${n.message} <small>(${n.type})</small></li>
              `).join('')}</ul>`
            : '<div class="empty-state">Belum ada notifikasi.</div>';

          content.innerHTML = `
            <h3>Klaim saya</h3>
            ${claimHtml}
            <hr />
            <h3>Notifikasi</h3>
            ${notifHtml}
          `;
        } catch (error) {
          content.innerHTML = `<div class="message error">${error.message}</div>`;
        }
      }

      loadDashboard();
    </script>
  </body>
</html>
