server {
  listen 80;
  server_name localhost;
  client_max_body_size 6m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/auth/ {
    proxy_pass http://auth-service:3001;
  }

  location /api/admin/identities {
    proxy_pass http://auth-service:3001;
  }

  location /api/admin/ {
    proxy_pass http://item-service:3002;
  }

  location /api/items {
    proxy_pass http://item-service:3002;
  }

  location /api/claims {
    proxy_pass http://claim-service:3003;
  }

  location /api/notifications {
    proxy_pass http://notification-service:3004;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
