services:
  postgres:
    image: postgres:16-alpine
    container_name: temubarang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build: ./auth-service
    container_name: temubarang-auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  item-service:
    build: ./item-service
    container_name: temubarang-item-service
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /app/uploads
    ports:
      - "3002:3002"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  claim-service:
    build: ./claim-service
    container_name: temubarang-claim-service
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ITEM_SERVICE_URL: http://item-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      item-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: temubarang-notification-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: temubarang-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - item-service
      - claim-service
      - notification-service

volumes:
  postgres_data:
  uploads_data:
